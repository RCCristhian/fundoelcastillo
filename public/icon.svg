<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Fondo redondeado estilo App Icon -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <g filter="url(#shadow)" transform="translate(0, 1)">
    <!-- Copa del sombrero -->
    <path d="M22 25 C22 15 25 9 32 9 C39 9 42 15 42 25 Z" fill="#d97706" stroke="#fef08a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Cinta tradicional del sombrero -->
    <path d="M22.5 22.5 C25 24 39 24 41.5 22.5" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Ala ancha del sombrero campesino -->
    <path d="M7 28 C14 23 23 22 32 22 C41 22 50 23 57 28 C52 31.5 42 29.5 32 29.5 C22 29.5 12 31.5 7 28 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Rostro silueta -->
    <path d="M24 31 V37 C24 41.5 27.5 45 32 45 C36.5 45 40 41.5 40 37 V31" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Nariz y Sonrisa -->
    <path d="M32 34 V37.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M28.5 40 C30.5 41.8 33.5 41.8 35.5 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cuello y Hombros -->
    <path d="M17 55 C17 48 24 47 32 47 C40 47 47 48 47 55" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>